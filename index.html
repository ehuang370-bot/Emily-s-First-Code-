<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emily's Homepage</title>

  <!-- STYLE: this part controls how the page LOOKS (colors, sizes, spacing) -->
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fdf2f8;      /* page background color */
      color: #3b0a2a;           /* text color */
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: white;
      max-width: 560px;
      width: 100%;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .avatar {
      font-size: 64px;          /* the big emoji at the top */
    }
    h1 {
      margin: 8px 0 4px;
      color: #db2777;           /* name color */
    }
    .tagline {
      color: #9d4b7a;
      margin-top: 0;
    }
    ul {
      list-style: none;
      padding: 0;
      text-align: left;
    }
    li {
      background: #fce7f3;
      margin: 8px 0;
      padding: 12px 16px;
      border-radius: 12px;
    }
    .colors {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }
    .swatch {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<!-- CONTENT: this part is WHAT the page says -->
<body>
  <div class="card">
    <div class="avatar">🌸</div>
    <h1>Hi, I'm Emily!</h1>
    <p class="tagline">This is my very first website.</p>

    <h2>A few things about me</h2>
    <ul>
      <li>🎵 I love listening to music</li>
      <li>📚 My favorite book is ...</li>
      <li>🍕 Best food ever: ...</li>
    </ul>

    <h2>My favorite colors</h2>
    <div class="colors">
      <div class="swatch" style="background: #db2777;"></div>
      <div class="swatch" style="background: #a78bfa;"></div>
      <div class="swatch" style="background: #34d399;"></div>
    </div>
  </div>
</body>
</html>
